plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        cobbleclub {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
    modImplementation "maven.modrinth:${project.cobblemon_project_id}:${project.cobblemon_version_id}"

    // Shared protocol/common modules used by both environments.
    modImplementation files('libs/clubhouse-common-claims-1.0.0.jar')
    modImplementation files('libs/clubhouse-common-tags-1.0.0.jar')
    modImplementation files('libs/clubhouse-common-wardrobe-1.0.0.jar')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

// Keep the three existing common modules nested in the ONE CobbleClub jar.
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into('META-INF/jars') {
        from files(
            'libs/clubhouse-common-claims-1.0.0.jar',
            'libs/clubhouse-common-tags-1.0.0.jar',
            'libs/clubhouse-common-wardrobe-1.0.0.jar'
        )
    }

    from('LICENSE') {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}
