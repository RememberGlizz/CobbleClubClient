name: Build CobbleClub 3.9.23

on:
  push:
    branches:
      - CobbleClub-V3.8.23-Claims-Kits-Warps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew clean build --stacktrace
      - name: Upload JARs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-3.9.23
          path: build/libs/*.jar
          if-no-files-found: error
