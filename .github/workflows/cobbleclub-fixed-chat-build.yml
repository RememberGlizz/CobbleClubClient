name: CobbleClub Fixed Chat Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Verify remapped chat selectors exist in built mixin class
        run: |
          javap -classpath build/libs/cobbleclub-3.9.25-cobblemon1.8.jar -v com.cobbleclub.client.mixin.ChatHudCompactMixin | grep -E "method_1814|method_44752"
      - name: Upload fixed test jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-32BadgePathways-FIXED-CHAT
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
