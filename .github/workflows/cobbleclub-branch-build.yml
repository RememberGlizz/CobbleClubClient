name: CobbleClub Branch Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
