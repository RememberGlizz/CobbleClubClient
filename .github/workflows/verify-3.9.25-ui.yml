name: Verify CobbleClub 3.9.25 UI Fixes

on:
  push:
    branches:
      - CobbleClub-V3.9.25-Kanto-RCT-Pathway
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x gradlew
      - run: ./gradlew clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-3.9.25-ui-fixed
          path: build/libs/*.jar
          if-no-files-found: error
