name: Build 3.9.26 Download
on:
  workflow_dispatch:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-3.9.26-current
          path: build/libs/*.jar
