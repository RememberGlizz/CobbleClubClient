name: CobbleClub Spawn Sanctuary Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Validate spawn sanctuary implementation
        run: |
          grep -q 'SPAWN_DIMENSION = "minecraft:overworld"' src/main/java/com/cobbleclub/server/service/SpawnVitalsService.java
          grep -q "spawnVitalsCaptured" src/main/java/com/cobbleclub/server/data/PlayerDataStore.java
          grep -q "type /wild to find a world" src/client/java/com/cobbleclub/client/hud/SpawnAdventureHud.java
          grep -q "and start your adventure" src/client/java/com/cobbleclub/client/hud/SpawnAdventureHud.java
          grep -q "SpawnVitalsHudMixin" src/main/resources/cobbleclub.client.mixins.json
          javap -classpath build/libs/cobbleclub-3.9.25-cobblemon1.8.jar -v com.cobbleclub.client.mixin.SpawnVitalsHudMixin | grep -E "method_37298|method_58477"
      - name: Upload test jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-Spawn-Sanctuary
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
