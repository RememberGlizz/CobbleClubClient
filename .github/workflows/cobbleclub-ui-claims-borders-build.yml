name: CobbleClub UI Claims Borders Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Validate requested fixes are in source
        run: |
          grep -q "worldBox.minX - cameraX" src/client/java/com/cobbleclub/client/claims/world/ClaimWorldRenderer.java
          grep -q "compactMapMode" src/client/java/com/cobbleclub/client/claims/panel/ClaimDetailPanel.java
          grep -q "this.warpsAllowed" src/client/java/com/cobbleclub/client/claims/panel/ClaimDetailPanel.java
          grep -q "EDGE_ANIMATION_INTERVAL_TICKS" src/main/java/com/cobbleclub/server/service/LeaderboardService.java
          grep -q "detailX + 7, top + 119, 100" src/client/java/com/cobbleclub/client/sell/SellScreen.java
      - name: Upload test jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-UI-Claims-Borders-Leaderboards
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
