name: build

on:
  push:
    branches:
      - CobbleClubClient-V3.8.4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
