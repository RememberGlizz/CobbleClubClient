name: CobbleClub Pathways Test

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and validate regional JSON
        run: |
          chmod +x gradlew
          python - <<'PY'
          import json, pathlib
          roots = [
              pathlib.Path('src/main/resources/data/rctmod'),
              pathlib.Path('src/main/resources/data/cobbleclub/advancement/johto'),
              pathlib.Path('src/main/resources/data/cobbleclub/advancement/hoenn'),
              pathlib.Path('src/main/resources/data/cobbleclub/advancement/sinnoh'),
          ]
          count = 0
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
                  count += 1
          print(f'Validated {count} JSON files')
          PY
          ./gradlew build --no-daemon --stacktrace
      - name: Upload pathway test jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-PremiumMenus-Contracts-32BadgePathways
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
