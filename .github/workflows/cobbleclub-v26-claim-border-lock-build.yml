name: CobbleClub V26 Claim Border Lock Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate claim UI fixes
        run: |
          grep -q "MatrixStack poseStack = new MatrixStack()" src/client/java/com/cobbleclub/client/claims/world/ClaimWorldRenderer.java
          grep -q "public static boolean toggleEnabled()" src/client/java/com/cobbleclub/client/claims/world/ClaimWorldRenderer.java
          grep -q "Border: ON" src/client/java/com/cobbleclub/client/claims/panel/ClaimDetailPanel.java
          grep -q "private int clipBottom" src/client/java/com/cobbleclub/client/claims/panel/ClaimDetailPanel.java
          grep -q "Dedicated fixed footer" src/client/java/com/cobbleclub/client/claims/panel/ClaimDetailPanel.java
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload fixed V26 jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-Claims-Border-Fixed
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
