name: CobbleClub V26 RCT Fix Build

on:
  push:
    branches:
      - CobbleClub-V3.9.26-Updates-PremiumMenus-Contracts

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate RCT data
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("src/main/resources/data")
          for p in root.rglob("*.json"):
              json.loads(p.read_text(encoding="utf-8"))

          bad = {
              "mr_mime": [],
              "nidoran_f": [],
              '"heldItem": "charcoal"': [],
          }
          for p in root.rglob("*.json"):
              s = p.read_text(encoding="utf-8")
              for token in bad:
                  if token in s:
                      bad[token].append(str(p))
          assert not any(bad.values()), bad

          series = pathlib.Path("src/main/resources/data/rctmod/series")
          expected = {
              "cobbleclub_johto.json": ["cobbleclub_kanto"],
              "cobbleclub_hoenn.json": ["cobbleclub_johto"],
              "cobbleclub_sinnoh.json": ["cobbleclub_hoenn"],
          }
          for name, req in expected.items():
              obj=json.loads((series/name).read_text())
              assert obj.get("requiredSeries")==req, (name,obj.get("requiredSeries"))

          first = [
              "cc_johto_violet_bird_keeper_rowan.json",
              "cc_johto_violet_schoolboy_eli.json",
              "cc_hoenn_rustboro_hiker_cole.json",
              "cc_hoenn_rustboro_youngster_reed.json",
              "cc_sinnoh_oreburgh_hiker_liam.json",
              "cc_sinnoh_oreburgh_worker_nia.json",
          ]
          mobroot=pathlib.Path("src/main/resources/data/rctmod/mobs/trainers/single")
          for name in first:
              obj=json.loads((mobroot/name).read_text())
              assert obj.get("requiredDefeats")==[], (name,obj.get("requiredDefeats"))
          print("RCT V26 validation passed")
          PY
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace
      - name: Upload fixed V26 jar
        uses: actions/upload-artifact@v4
        with:
          name: CobbleClub-V3.9.26-V26-RCT-FIXED
          path: build/libs/cobbleclub-3.9.25-cobblemon1.8.jar
          if-no-files-found: error
